<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ task_name }} - {{ filename }}</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 24px; color: #222; }
        header { border-bottom: 1px solid #ddd; margin-bottom: 24px; padding-bottom: 8px; color: #666; font-size: 0.9rem; }
        pre { background: #f5f5f5; padding: 12px; overflow-x: auto; border-radius: 6px; }
        code { background: #f5f5f5; padding: 1px 4px; border-radius: 4px; }
        pre code { background: none; padding: 0; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 4px 8px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
    <header>
        <strong>{{ task_name }}</strong> &middot; {{ filename }} &middot; coach material
    </header>
    <main dir="auto">
        {% if is_markdown %}
        {{ content|markdown }}
        {% else %}
        <pre dir="auto">{{ content }}</pre>
        {% endif %}
    </main>
</body>
</html>
