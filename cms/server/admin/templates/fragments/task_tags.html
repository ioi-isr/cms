<div class="cell is-col-span-2">
    <div class="field">
        <label class="label" for="task-tags">Custom tags</label>
        <div class="control">
            {# Keep JSON-looking names from becoming Tagify metadata. #}
            <input class="input" id="task-tags" name="tags" value="{{ task.custom_tags | tojson | forceescape }}" placeholder="Add tags" />
        </div>
        <p class="help">Saved with the task. Batch, communication, output only, and checker tags are added automatically from the active dataset.</p>
    </div>
    <div class="tags">
        {% for tag in task.automatic_tags %}
        <span class="tag is-info is-light">{{ tag }}</span>
        {% endfor %}
    </div>
</div>
